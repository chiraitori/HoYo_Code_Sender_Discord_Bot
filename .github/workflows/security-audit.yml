name: Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run security audit every Monday at 2 AM UTC
    - cron: '0 2 * * 1'

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
    
    - name: Install dependencies
      run: npm install

    - name: Install dashboard dependencies
      run: npm ci --prefix dashboard
    
    - name: Run npm audit
      run: npm audit --audit-level moderate
      continue-on-error: true
    
    - name: Run npm audit (JSON output)
      run: npm audit --json > audit-results.json
      continue-on-error: true

    - name: Run dashboard production audit
      run: npm audit --prefix dashboard --omit=dev --json > dashboard-audit-results.json
      continue-on-error: true
    
    - name: Upload audit results
      uses: actions/upload-artifact@v7
      with:
        name: security-audit-results
        path: |
          audit-results.json
          dashboard-audit-results.json
        retention-days: 30
    
    - name: Check for high/critical vulnerabilities
      run: |
        for REPORT in audit-results.json dashboard-audit-results.json; do
          jq -e '.metadata.vulnerabilities | (.high | type == "number") and (.critical | type == "number")' "$REPORT" > /dev/null
          HIGH_VULNS=$(jq '.metadata.vulnerabilities.high' "$REPORT")
          CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical' "$REPORT")
          echo "$REPORT: high=$HIGH_VULNS critical=$CRITICAL_VULNS"

          if [ "$HIGH_VULNS" -gt 0 ] || [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "::error::Security audit failed due to high/critical vulnerabilities in $REPORT"
            exit 1
          fi
        done
    
    - name: Comment PR with audit results (if PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          try {
            const auditResults = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            const vulnCount = auditResults.metadata?.vulnerabilities || {};
            
            const comment = `## 🔒 Security Audit Results
            
            **Vulnerability Summary:**
            - Critical: ${vulnCount.critical || 0}
            - High: ${vulnCount.high || 0}
            - Moderate: ${vulnCount.moderate || 0}
            - Low: ${vulnCount.low || 0}
            
            **Status:** ${(vulnCount.critical || 0) + (vulnCount.high || 0) > 0 ? '❌ Action Required' : '✅ Passed'}
            
            ${(vulnCount.critical || 0) + (vulnCount.high || 0) > 0 ? 
              '**Action Required:** Please run `npm audit fix` to resolve vulnerabilities.' : 
              '**All clear!** No critical or high severity vulnerabilities found.'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not parse audit results or create comment:', error);
          }
